seed: 3407


# Models are instantiated using skrl's model instantiator utility
# https://skrl.readthedocs.io/en/latest/api/utils/model_instantiators.html
models:
  separate: True
  policy:  # see gaussian_model parameters
    class: MultivariateGaussianMixin  # GaussianMixin
    clip_actions: False
    clip_log_std: True
    min_log_std: -20.0
    max_log_std: 2.0
    initial_log_std: 0.0
    network:
      - name: net
        input: OBSERVATIONS
        layers: [512, 256,256]
        activations: elu
    output: ACTIONS
  value:  # see deterministic_model parameters
    class: DeterministicMixin
    clip_actions: False
    network:
      - name: net
        input: STATES
        layers: [512, 256,256]
        activations: elu
    output: ONE
  discriminator:  # see deterministic_model parameters
    class: DeterministicMixin
    clip_actions: False
    network:
      - name: net
        input: STATES
        layers: [1024,512,256]
        activations: relu
    output: ONE


# Rollout memory
# https://skrl.readthedocs.io/en/latest/api/memories/random.html
memory:
  class: RandomMemory
  memory_size: -1  # automatically determined (same as agent:rollouts)

# AMP memory (reference motion dataset)
# https://skrl.readthedocs.io/en/latest/api/memories/random.html
motion_dataset:
  class: RandomMemory
  memory_size: 500

# AMP memory (preventing discriminator overfitting)
# https://skrl.readthedocs.io/en/latest/api/memories/random.html
# reply_buffer:
#   class: RandomMemory
#   memory_size: 500000


# PPO agent configuration (field names are from PPO_DEFAULT_CONFIG)
# https://skrl.readthedocs.io/en/latest/api/agents/ppo.html
agent:
  class: AMP
  rollouts: 24
  learning_epochs: 5
  mini_batches: 4
  discount_factor: 0.99
  lambda: 0.95
  learning_rate: 1.0e-4
  learning_rate_scheduler: KLAdaptiveLR
  learning_rate_scheduler_kwargs:
    kl_threshold: 0.01
    max_lr: 0.0025
  state_preprocessor: RunningStandardScaler
  state_preprocessor_kwargs: null
  observation_preprocessor: RunningStandardScaler
  observation_preprocessor_kwargs: null
  value_preprocessor: RunningStandardScaler
  value_preprocessor_kwargs: null
  amp_state_preprocessor: RunningStandardScaler
  amp_state_preprocessor_kwargs: null
  random_timesteps: 0
  learning_starts: 0
  grad_norm_clip: 1.0
  ratio_clip: 0.2
  value_clip: 0.2
  clip_predicted_values: True
  entropy_loss_scale: 0.005
  value_loss_scale: 1.0 # 2.0???
  discriminator_loss_scale: 1.
  amp_batch_size: 512
  task_reward_weight: 1.0
  style_reward_weight: 0.02
  discriminator_batch_size: 4096
  discriminator_reward_scale: 5  #2
  discriminator_logit_regularization_scale: 0.05  # 0.05
  discriminator_gradient_penalty_scale: 10.0
  discriminator_weight_decay_scale: 1.0e-04
  kl_threshold: 0.0

  #wasserstein_discriminator
  soft_boundary_constraint_scale: 0.1 #0.1
  max_style_reward_scale: 5


  discriminator_loss_type: "MSE"

  with_reply_sample: False #if set "with_reply_sample" to true ,you need to cancel comment in line 55-57 
  #symmetry loss
  use_symmetry_loss: True
  symmetry_scale: 1
  disc_sym_loss_mode: 3 # 0 for no symmetry loss, 1 for symmetry loss on the policy data, 2 for symmetry loss on the expert data, 3 for 2+1

  # rewards_shaper_scale: 0.01
  time_limit_bootstrap: True
  # logging and checkpoint
  experiment:
    directory: "velocity_amp/roban_s2_flat_csp_mse"
    experiment_name: ""
    write_interval: 24
    checkpoint_interval: 2400


# Sequential trainer
# https://skrl.readthedocs.io/en/latest/api/trainers/sequential.html
trainer:
  class: SequentialTrainer
  timesteps: 360000
  environment_info: log